name: Deploy Backend to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Biozin-Royale-Backend.slnx

      - name: Build
        run: dotnet build Biozin-Royale-Backend.slnx -c Release --no-restore

      - name: Publish
        run: dotnet publish Biozin-Royale-Backend.API/Biozin-Royale-Backend.API.csproj -c Release --no-build -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: biozin-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
